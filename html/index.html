<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kipchak Sobriety</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="card" class="card hidden">
        <div class="card-header">
            <span class="led"></span>
            <span id="title" class="title"></span>
        </div>
        <div class="screen">
            <div id="alcohol" class="alcohol">
                <div class="reading">
                    <span id="value" class="value"></span>
                    <span id="unit" class="unit"></span>
                </div>
            </div>
            <div id="drugs" class="drugs"></div>
            <div id="status" class="status"></div>
        </div>
        <div class="meta">
            <div class="row"><span id="labelSubject" class="key"></span><span id="subject" class="val"></span></div>
            <div class="row"><span id="labelOfficer" class="key"></span><span id="officer" class="val"></span></div>
            <div class="row"><span id="labelDate" class="key"></span><span id="date" class="val"></span></div>
        </div>
        <div class="footer">
            <span id="closeHint" class="hint"></span>
            <span id="brand" class="brand">KIPCHAK STUDIOS</span>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
